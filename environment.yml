name: cuda-acceleration-engine
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11.9
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu124
    - torch>=2.4.0,<2.7.0
    - numpy>=1.24.0,<3.0.0
    - fastapi>=0.115.0,<1.0.0
    - uvicorn[standard]>=0.30.0,<1.0.0
    - pydantic>=2.7.0,<3.0.0
    - starlette>=0.38.0,<1.0.0
    - pyyaml>=6.0,<7.0
    - pytest>=8.0.0,<10.0.0
    - httpx>=0.27.0,<1.0.0
    - requests>=2.30.0,<3.0.0

